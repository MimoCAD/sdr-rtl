[package]
name = "sdr-rtl"
version = "0.1.0"
edition = "2024"
description = "A pure-Rust RTL2832U + R820T/R820T2 receiver driver over nusb, written from the vendor documents and bench records: streams that cannot lose samples unseen, every lost block counted, EEPROM read and write. No libusb, no librtlsdr"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MimoCAD/sdr-rtl"
readme = "README.md"
keywords = ["sdr", "rtl-sdr", "rtl2832u", "radio", "usb"]
categories = ["hardware-support"]
# The derivation's records and bench programs stay in the repository.
exclude = ["derivation/", "examples/"]

[lib]
doctest = false

# This crate → nusb → the OS.
[dependencies]
sdr-core = { version = "0.1", features = ["usb"] }
# Pure-Rust userspace USB (IOKit/usbfs directly, no libusb).
nusb = "0.2"

[features]
# The request layer exposed (`Rtl::link`, `Rtl::rx_stream`) for the bench
# programs in examples/.
bench = []

# The bench programs (steps 11-17).
[[example]]
name = "filterstudy"
required-features = ["bench"]

[[example]]
name = "record"
required-features = ["bench"]

[[example]]
name = "vcoedge"
required-features = ["bench"]

[[example]]
name = "imrsearch"
required-features = ["bench"]

[[example]]
name = "dropcounter"
required-features = ["bench"]

[[example]]
name = "dropphase"
required-features = ["bench"]

[[example]]
name = "fifosize"
required-features = ["bench"]

[[example]]
name = "opcost"
required-features = ["bench"]

[[example]]
name = "bracket"
required-features = ["bench"]

[[example]]
name = "cleanstart"
required-features = ["bench"]

[[example]]
name = "stallprobe"
required-features = ["bench"]

[[example]]
name = "hwcheck"
required-features = ["bench"]

[[example]]
name = "fifoprobe"
required-features = ["bench"]

[[example]]
name = "glitchscan"
required-features = ["bench"]

[[example]]
name = "eepromread"
required-features = ["bench"]

[[example]]
name = "eepromwrite"
required-features = ["bench"]

[[example]]
name = "finishloop"
required-features = ["bench"]
