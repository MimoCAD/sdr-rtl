[package]
name = "sdr-rtl-derived"
version = "0.1.0"
edition = "2024"
description = "An RTL2832U + R820T-family receiver driver written from the vendor documents and the bench records under ../derivation"
license = "MIT OR Apache-2.0"

[lib]
doctest = false

# Its own root: the package is built, tested and linted on its own.
[workspace]

[dependencies]
sdr-core = { path = "../../core", features = ["usb"] }
nusb = "0.2"

[features]
# The request layer exposed (`Rtl::link`) for the bench programs in examples/.
bench = []

[[example]]
name = "filterstudy"
required-features = ["bench"]

[[example]]
name = "record"
required-features = ["bench"]

[[example]]
name = "vcoedge"
required-features = ["bench"]

[[example]]
name = "imrsearch"
required-features = ["bench"]

[[example]]
name = "dropcounter"
required-features = ["bench"]

[[example]]
name = "dropphase"
required-features = ["bench"]

[[example]]
name = "fifosize"
required-features = ["bench"]

[[example]]
name = "opcost"
required-features = ["bench"]

[[example]]
name = "bracket"
required-features = ["bench"]

[[example]]
name = "cleanstart"
required-features = ["bench"]

[[example]]
name = "stallprobe"
required-features = ["bench"]
