[package]
name = "sdr-rtl"
version = "0.1.0"
edition = "2024"
description = "A pure-Rust RTL2832U + R820T/R820T2 receiver driver over nusb, written from the vendor documents and bench records: streams that cannot lose samples unseen, every lost block counted, EEPROM read and write. No libusb, no librtlsdr"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MimoCAD/sdr-rtl"
readme = "README.md"
keywords = ["sdr", "rtl-sdr", "rtl2832u", "radio", "usb"]
categories = ["hardware-support"]
# The derivation's records and bench programs stay in the repository.
exclude = ["derivation/", "examples/", "web/"]

[lib]
doctest = false

# This crate → nusb → the OS (with `std`); without it, no_std + alloc.
[dependencies]
sdr-core = { version = "0.1", default-features = false }
# Pure-Rust userspace USB (IOKit/usbfs directly, no libusb).
nusb = { version = "0.2", optional = true }

[features]
default = ["std"]
# The receiver: the USB request layer, `Rtl`, the raw stream and `Stream`.
std = ["dep:nusb", "sdr-core/usb"]
# The request layer exposed (`Rtl::link`, `Rtl::rx_stream`) for the bench
# programs in examples/.
bench = ["std"]

# The bench programs (steps 11-17).
